# There is deliberately no [project] table: this repository is not a
# distributable Python package. The deliverable is the static site generated by
# `daily_pipeline.py` and published to GitHub Pages, and roughly 120 of the
# modules that produce it still live at the repository root rather than inside
# `institution_scanner/`. A wheel built from the package directory would
# therefore be missing most of the scanner. Run it from a source checkout:
#   pip install -r requirements.txt && python -m institution_scanner scan

[tool.pytest.ini_options]
# Without pythonpath, a bare `pytest` invocation does not put the repository
# root on sys.path (only tests/ is inserted under the default prepend import
# mode), so `import institution_scanner` fails. `python -m pytest` happened to
# work because it prepends the cwd. Pinning pythonpath makes both entry points
# behave identically.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
  ".venv",
  "cache",
  "output",
  "logs",
  ".ruff_cache",
]

[tool.ruff.lint]
select = ["F", "I", "UP035", "RUF046", "RUF059"]

[tool.ruff.lint.per-file-ignores]
# Frozen compatibility kernel: keep new/canonical code on modern typing imports
# without rewriting the legacy publication layer solely for lint modernization.
"web_report_v102.py" = ["UP035"]
