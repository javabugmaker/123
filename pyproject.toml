[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
  ".venv",
  "cache",
  "output",
  "logs",
  ".ruff_cache",
  "tools/apply_project_hardening.py",
  "tools/v34_migrate.py",
]

[tool.ruff.lint]
select = ["F", "I", "UP035", "RUF046", "RUF059"]

[tool.ruff.lint.per-file-ignores]
# Frozen compatibility kernel: keep new/canonical code on modern typing imports
# without rewriting the legacy publication layer solely for lint modernization.
"web_report_v102.py" = ["UP035"]
