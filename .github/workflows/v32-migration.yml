name: V32 Migration Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate-and-test:
    if: github.head_ref == 'agent/asset-top50-ranking-v32'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/asset-top50-ranking-v32
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply v32 migration
        run: python tools/v32_migrate.py
      - name: Compile
        run: python -m py_compile report.py config.py test_v32_asset_top50_ranking.py
      - name: Focused tests
        run: python -m unittest -v test_v32_asset_top50_ranking.py test_v31_stock_universe_integrity.py test_v30_performance_workstation.py
      - name: Full regression
        run: python -m unittest discover -v
      - name: Commit validated product diff
        run: |
          rm -f tools/v32_migrate.py .github/workflows/v32-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: separate asset top50 ranking from trade eligibility v32"
          git push origin HEAD:agent/asset-top50-ranking-v32
