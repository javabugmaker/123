name: v26 one-shot compatibility repair

on:
  push:
    branches:
      - agent/gui-workstation-v26
    paths:
      - tools/apply_v26_ci_fixes.py
      - .github/workflows/v26-one-shot-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gui-workstation-v26
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply compatibility fixes
        run: python tools/apply_v26_ci_fixes.py
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate
        env:
          MPLBACKEND: Agg
        run: |
          python -m compileall -q .
          python -m unittest discover -v
      - name: Remove one-shot migration files
        run: |
          rm tools/apply_v26_ci_fixes.py
          rm .github/workflows/v26-one-shot-fix.yml
      - name: Commit repaired v26
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gui.py test_gui_workstation_v26.py tools/apply_v26_ci_fixes.py .github/workflows/v26-one-shot-fix.yml
          git commit -m "fix: preserve GUI contracts in v26"
          git push origin HEAD:agent/gui-workstation-v26
