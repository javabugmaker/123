name: Apply Clash AkShare proxy hotfix

on:
  push:
    branches: [main]
    paths:
      - tools/apply_clash_akshare_fix.py
      - .github/workflows/apply-clash-akshare-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply proxy fix
        run: python tools/apply_clash_akshare_fix.py
      - name: Syntax check
        run: python -m py_compile downloader.py fundamental_data.py
      - name: Commit patched files
        run: |
          if git diff --quiet -- downloader.py fundamental_data.py; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloader.py fundamental_data.py
          git commit -m "fix: support Clash system proxy for AkShare"
          git push origin HEAD:main
