name: Validate Research Integrity v23

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  migrate-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/research-integrity-v23
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply deterministic migration
        run: |
          python research_integrity_v23_migration.py
          python research_integrity_v23_contract_patch.py
          python research_integrity_v23_gui_contract_patch.py
      - name: Install migrated dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate complete implementation
        shell: bash
        env:
          MPLBACKEND: Agg
        run: |
          python -m compileall -q .
          python -m unittest discover -v
      - name: Publish verified implementation to PR branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: research integrity v23'
          git push origin HEAD:agent/research-integrity-v23
