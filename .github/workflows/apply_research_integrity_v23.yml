name: Apply Research Integrity v23

on:
  push:
    branches: ['agent/research-integrity-v23']
    paths:
      - 'research_integrity_v23_migration.py'
      - '.github/workflows/apply_research_integrity_v23.yml'

permissions:
  contents: write

jobs:
  migrate-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/research-integrity-v23
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply deterministic migration
        run: python research_integrity_v23_migration.py
      - name: Install migrated dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate and publish verified commit
        shell: bash
        env:
          MPLBACKEND: Agg
        run: |
          set +e
          python -m compileall -q .
          compile_status=$?
          python -m unittest discover -v > migration_tests.log 2>&1
          test_status=$?
          cat migration_tests.log
          if [ "$compile_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add migration_tests.log
            git commit -m 'test: capture v23 migration failure' || true
            git push origin HEAD:agent/research-integrity-v23
            exit 1
          fi
          rm -f migration_tests.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: research integrity v23'
          git push origin HEAD:main
          git push origin HEAD:agent/research-integrity-v23
