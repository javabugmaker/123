name: Apply TickFlow Free migration

on:
  push:
    branches: [main]
    paths:
      - tools/migrate_tickflow_free.py
      - .github/workflows/apply-tickflow-free-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply migration
        run: python tools/migrate_tickflow_free.py
      - name: Compile changed Python
        run: python -m compileall -q downloader.py analytics.py scanner.py main.py gui_core.py gui.py fundamental_data.py test_tickflow_provider.py
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloader.py analytics.py scanner.py main.py gui_core.py gui.py fundamental_data.py config.py requirements.txt test_regressions.py test_tickflow_provider.py
          if git diff --cached --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git commit -m "refactor: use TickFlow Free for market data"
          git push origin main
