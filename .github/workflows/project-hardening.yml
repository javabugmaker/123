name: Apply project hardening

on:
  push:
    branches: [main]
    paths:
      - tools/apply_project_hardening.py
      - tools/v37_compat_fix.py
      - .github/workflows/project-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply v37 migration
        run: python tools/apply_project_hardening.py

      - name: Update forward-compatible regression contracts
        run: python tools/v37_compat_fix.py

      - name: Validate syntax
        run: |
          python -m compileall -q .
          git diff --check

      - name: Run tests
        run: python -m unittest discover -v

      - name: Commit validated v37 directly to main
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: project integrity and evidence UX v37"
          git push origin HEAD:main
