name: Apply project hardening

on:
  push:
    branches: [main]
    paths:
      - tools/v37_static_fix.py
      - .github/workflows/project-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies and static tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pyright

      - name: Apply final v37 static fix
        run: python tools/v37_static_fix.py

      - name: Validate static quality
        run: |
          ruff check .
          pyright -p pyrightconfig.json
          pyright -p pyrightconfig.gui.json
          python -m compileall -q .
          git diff --check

      - name: Run tests
        run: python -m unittest discover -v

      - name: Commit validated static fix directly to main
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "style: finalize v37 static quality"
          git push origin HEAD:main
