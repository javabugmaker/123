name: Apply project hardening

on:
  push:
    branches: [main]
    paths:
      - tools/apply_project_hardening.py
      - .github/workflows/project-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply refactor
        run: python tools/apply_project_hardening.py

      - name: Validate syntax
        run: |
          python -m compileall -q .
          git diff --check

      - name: Run tests
        run: python -m unittest discover -v

      - name: Commit directly to main
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloader.py score.py analytics.py fundamental_data.py fundamental_quality.py main.py signal_lifecycle.py scanner.py gui_core.py gui.py config.py requirements.txt test_hardening_regressions.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: harden data scoring and backtest consistency"
          git push origin HEAD:main
