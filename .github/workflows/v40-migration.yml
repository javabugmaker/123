name: Validate v40 output semantics

on:
  push:
    branches: [main]
    paths:
      - tools/v40_migrate.py
      - .github/workflows/v40-migration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies and static tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pyright

      - name: Apply v40 migration
        run: python tools/v40_migrate.py

      - name: Static validation
        run: |
          ruff check .
          pyright -p pyrightconfig.json
          pyright -p pyrightconfig.gui.json
          python -m compileall -q .
          git diff --check

      - name: Focused v40 regression
        run: python -m unittest -v test_v40_output_semantics.py test_v39_decision_integrity.py test_v38_fundamental_gate2.py test_v37_project_integrity.py test_v35_model_integrity.py

      - name: Full regression
        run: python -m unittest discover -v

      - name: Commit validated v40 directly to main and self-clean
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.py report.py signal_lifecycle.py README.md test_v40_output_semantics.py
          git rm tools/v40_migrate.py .github/workflows/v40-migration.yml
          git commit -m "fix: separate candidate views and final explanations v40"
          git push origin HEAD:main
