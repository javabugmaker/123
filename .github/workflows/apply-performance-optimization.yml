name: Apply performance optimization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-performance-optimization.yml'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply optimization patch
        run: |
          python tools/performance_optimize_migration.py
          python tools/performance_compat_hotfix.py

      - name: Compile changed modules
        run: |
          python -m py_compile performance_cache.py analytics.py scanner.py downloader.py gui_core.py main.py

      - name: Run regression suite
        env:
          PYTHONUTF8: '1'
        run: python -m unittest discover -p 'test*.py'

      - name: Commit optimized implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/performance_optimize_migration.py tools/performance_compat_hotfix.py .github/workflows/apply-performance-optimization.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'perf: accelerate scanner and historical backtests'
          git push origin HEAD:main
