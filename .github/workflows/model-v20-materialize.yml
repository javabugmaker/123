name: Model V20 Materialize

on:
  push:
    branches:
      - agent/model-v20-consistency-performance

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/model-v20-consistency-performance
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Apply model v20 migration
        run: python tools/model_v20_migrate.py
      - name: Compile
        run: python -m compileall -q .
      - name: Unit tests
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -v
      - name: Materialize validated source
        run: |
          rm tools/model_v20_migrate.py
          rm .github/workflows/model-v20-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialized changes"
            exit 0
          fi
          git commit -m "refactor: model v20 consistency and performance"
          git push origin HEAD:agent/model-v20-consistency-performance
