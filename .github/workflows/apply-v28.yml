name: Apply v28 GUI Backtest

on:
  push:
    branches:
      - agent/gui-backtest-v28
    paths:
      - .github/workflows/apply-v28.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gui-backtest-v28
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Apply v28 patch
        run: python tools/apply_v28_gui_backtest.py

      - name: Compile
        run: python -m compileall -q .

      - name: Focused v28 tests
        env:
          MPLBACKEND: Agg
        run: python -m unittest -v test_v28_gui_backtest.py test_v27_gui_pipeline.py test_gui_workstation_v26.py test_performance_regressions.py

      - name: Full regression suite
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -v

      - name: Commit final product diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics.py gui.py test_v28_gui_backtest.py
          git rm tools/apply_v28_gui_backtest.py .github/workflows/apply-v28.yml README_V28_TMP.md
          git commit -m "perf: evidence-gate exact refinement and polish v28 GUI"
          git push origin HEAD:agent/gui-backtest-v28
