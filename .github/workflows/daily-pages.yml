name: Daily A-Share Pages

on:
  workflow_dispatch:
  schedule:
    # 15:40 Asia/Shanghai, Monday-Friday. GitHub cron uses UTC.
    - cron: '40 7 * * 1-5'

permissions:
  contents: read

concurrency:
  group: institution-scanner-daily-pages
  cancel-in-progress: false

jobs:
  compute-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      PYTHONUNBUFFERED: '1'
      # Build locally first; publication happens only after reliability and
      # freshness contracts both pass.
      INSTITUTION_SCANNER_WEB_PUBLISH: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-ci.txt

      - name: Restore market/runtime cache
        uses: actions/cache@v4
        with:
          path: |
            cache
            output/AllResults.parquet
            output/SignalHistory.csv
            output/SignalTracking.csv
          key: institution-daily-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            institution-daily-${{ runner.os }}-

      - name: Install runtime
        run: pip install -c constraints-ci.txt -r requirements.txt

      - name: Run canonical DAILY pipeline without publishing
        shell: bash
        run: python daily_pipeline.py --backtest-mode fast

      - name: Verify model and output contracts
        shell: bash
        run: python -m institution_scanner.verify_output output

      - name: Verify current-session freshness
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from publication_freshness_v101 import validate_live_publication

          check = validate_live_publication(Path('output'))
          print(check.to_dict())
          if not check.ready:
              raise SystemExit(
                  f'LIVE publication contract failed: {check.status}: {check.reason}'
              )
          PY

      - name: Package verified static site
        uses: actions/upload-artifact@v4
        with:
          name: verified-pages-site
          path: output/web_report
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: compute-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout publication transport
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download verified site
        uses: actions/download-artifact@v4
        with:
          name: verified-pages-site
          path: output/web_report

      - name: Configure GitHub token for Pages push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth}"

      - name: Publish immutable verified artifact
        shell: bash
        run: python -m institution_scanner.publish_site output/web_report
