name: Validate v39 decision integrity

on:
  push:
    branches: [main]
    paths:
      - tools/v39_migrate.py
      - .github/workflows/v39-migration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies and static tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pyright

      - name: Apply v39 migration
        run: python tools/v39_migrate.py

      - name: Static validation
        run: |
          ruff check .
          pyright -p pyrightconfig.json
          pyright -p pyrightconfig.gui.json
          python -m compileall -q .
          git diff --check

      - name: Focused v39 regression
        run: python -m unittest -v test_v39_decision_integrity.py test_v38_fundamental_gate2.py test_v37_project_integrity.py test_v35_model_integrity.py

      - name: Full regression
        run: python -m unittest discover -v

      - name: Commit validated v39 directly to main
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.py report.py signal_lifecycle.py signal_lifecycle_core.py test_v39_decision_integrity.py
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "fix: close decision integrity gaps v39"
          git push origin HEAD:main
