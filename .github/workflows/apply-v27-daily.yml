name: Apply v27 Daily Pipeline

# trigger: v27 daily pipeline migration
on:
  push:
    branches:
      - agent/backtest-parallel-v27
    paths:
      - .github/workflows/apply-v27-daily.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/backtest-parallel-v27
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Apply v27 migration
        run: python tools/apply_v27_daily_pipeline.py

      - name: Compile
        run: python -m compileall -q .

      - name: Focused v27 tests
        env:
          MPLBACKEND: Agg
        run: python -m unittest -v test_daily_pipeline_v27.py test_v27_gui_pipeline.py test_performance_regressions.py

      - name: Full regression suite
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -v

      - name: Commit final product diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gui.py analytics.py
          git rm tools/apply_v27_daily_pipeline.py .github/workflows/apply-v27-daily.yml
          git commit -m "feat: add one-click daily workflow and parallel backtests"
          git push origin HEAD:agent/backtest-parallel-v27
