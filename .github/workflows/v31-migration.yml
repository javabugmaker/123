name: V31 Migration Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate-and-test:
    if: github.head_ref == 'agent/stock-universe-integrity-v31'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stock-universe-integrity-v31
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply v31 migration
        run: |
          python tools/v31_migrate.py
          python tools/v31_fix_migration.py
      - name: Compile
        run: python -m py_compile downloader.py scanner.py report.py daily_pipeline.py config.py test_v31_stock_universe_integrity.py
      - name: Focused tests
        run: python -m unittest -v test_v31_stock_universe_integrity.py test_v29_pipeline_reliability.py test_v30_performance_workstation.py
      - name: Full regression
        run: python -m unittest discover -v
      - name: Commit validated product diff
        run: |
          rm -f tools/v31_migrate.py tools/v31_fix_migration.py .github/workflows/v31-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore stock universe integrity v31"
          git push origin HEAD:agent/stock-universe-integrity-v31
