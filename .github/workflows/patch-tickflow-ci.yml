name: Patch TickFlow CI cleanup

on:
  push:
    branches: [agent/tickflow-finalize]
    paths:
      - tools/patch_tickflow_ci.py
      - .github/workflows/patch-tickflow-ci.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tickflow-finalize
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python tools/patch_tickflow_ci.py
      - name: Compile patched sources
        run: python -m compileall -q analytics.py downloader.py main.py fundamental_data.py scanner.py test_regressions.py test_tickflow_provider.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "test: align suite with TickFlow Free architecture"
          git push origin HEAD:agent/tickflow-finalize
