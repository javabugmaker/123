name: Static Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and quality tools
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Pyright project
        run: pyright
      - name: Pyright GUI strict
        run: pyright -p pyrightconfig.gui.json
      - name: Model and output contract regression
        run: pytest -q
      - name: Compile
        run: python -m compileall -q .
