name: Static Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # This job runs
          # tests/test_signal_lifecycle_extraction_equivalence.py, which reads the
          # pre-move source straight out of the object store
          # (``git show <sha>:signal_lifecycle_core.py``).  checkout defaults to
          # fetch-depth: 1, which drops that commit and fails the gate with a bare
          # "exit status 128" that says nothing about the cause.
          # daily-pages.yml already pins fetch-depth: 0 for the same reason.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints-ci.txt
      - name: Install project and quality tools
        run: |
          pip install -c constraints-ci.txt -r requirements.txt
          pip install -c constraints-ci.txt -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Canonical package strict Ruff
        run: ruff check institution_scanner --select B,C4,SIM,PERF,PIE
      - name: Pyright project
        run: pyright
      - name: Pyright GUI strict
        run: pyright -p pyrightconfig.gui.json
      - name: Model and output contract regression
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q .

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-ci.txt
      - name: Install runtime
        run: pip install -c constraints-ci.txt -r requirements.txt
      - name: Compile and import canonical entry points
        shell: pwsh
        run: |
          python -m compileall -q institution_scanner
          # gui_v85 is the entry point README tells desktop users to run, so it
          # has to be importable on Windows even though CI never opens a window
          # (module import is side-effect free; main() sits behind __main__).
          python -c "import main, daily_pipeline, web_report_v81, gui_v85"
