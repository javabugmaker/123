name: Static Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints-ci.txt
      - name: Install project and quality tools
        run: |
          pip install -c constraints-ci.txt -r requirements.txt
          pip install -c constraints-ci.txt -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Canonical package strict Ruff
        run: ruff check institution_scanner --select B,C4,SIM,PERF,PIE
      - name: Pyright project
        run: pyright
      - name: Pyright GUI strict
        run: pyright -p pyrightconfig.gui.json
      - name: Model and output contract regression
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q .
