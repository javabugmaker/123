name: Static Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints-ci.txt
      - name: Install project and quality tools
        run: |
          pip install -c constraints-ci.txt -r requirements.txt
          pip install -c constraints-ci.txt -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Canonical package strict Ruff
        run: ruff check institution_scanner --select B,C4,SIM,PERF,PIE
      - name: Pyright project
        run: pyright
      - name: Pyright GUI strict
        run: pyright -p pyrightconfig.gui.json
      # TEMPORARY DIAGNOSTIC: the gate has been red since ca5a36b (2026-09-10)
      # on ubuntu/3.11 while staying green on Windows locally, and the job log
      # is not readable anonymously.  Step *conclusions* and check-run
      # *annotations* are readable, so the failure summary is republished as an
      # annotation below.  Revert to a plain `python -m pytest -q` once fixed.
      - name: Contract regression
        run: |
          set -o pipefail
          python -m pytest -q --tb=short -rf 2>&1 | tee pytest-out.txt
      - name: Publish failure summary as annotation
        if: always()
        run: |
          cat > /tmp/dump_fail.py <<'PY'
          import pathlib

          text = ""
          candidate = pathlib.Path("pytest-out.txt")
          if candidate.exists():
              text = candidate.read_text(errors="replace")
          failed = [line for line in text.splitlines() if line.startswith("FAILED")]
          summary = "\n".join(failed[:40]) if failed else "(no FAILED lines)"
          msg = "FAILED_LINES:\n" + summary + "\n=====TAIL=====\n" + text[-2600:]
          msg = msg.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error::" + msg[:6000])
          PY
          python /tmp/dump_fail.py
      - name: Compile
        run: python -m compileall -q .

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-ci.txt
      - name: Install runtime
        run: pip install -c constraints-ci.txt -r requirements.txt
      - name: Compile and import canonical entry points
        shell: pwsh
        run: |
          python -m compileall -q institution_scanner
          # gui_v85 is the entry point README tells desktop users to run, so it
          # has to be importable on Windows even though CI never opens a window
          # (module import is side-effect free; main() sits behind __main__).
          python -c "import main, daily_pipeline, web_report_v81, gui_v85"
