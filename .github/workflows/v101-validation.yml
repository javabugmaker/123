name: V101 Validation

on:
  push:
    branches: [refactor/v101-canonical-web-report]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONHASHSEED: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Import smoke test
        env:
          MPLBACKEND: Agg
        run: python -c "import analytics, backtest_alignment, daily_pipeline, downloader, filters, main, pipeline_contracts, report, scan_service, score, signal_lifecycle, volatility_state, web_report"
      - name: Execution integrity invariants
        env:
          MPLBACKEND: Agg
        run: python -m unittest -v test_v51_execution_integrity test_v52_runtime_output_integrity test_v53_daily_data_date_integrity test_v54_trade_liquidity_integrity
      - name: Unit tests
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -v
      - name: Pandas Copy-on-Write vectorization contract
        env:
          MPLBACKEND: Agg
          PANDAS_COPY_ON_WRITE: '1'
        run: >-
          python -m unittest -v
          test_v86_score_vectorization_integrity.ResearchPolicyVectorizationTests
