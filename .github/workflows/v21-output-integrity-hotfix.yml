name: Apply v21 output integrity hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v21-output-integrity-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic v21 patches
        run: python scripts/v21_hotfix.py
      - name: Syntax checks
        run: python -m py_compile analytics.py scanner.py signal_lifecycle.py gui_core.py config.py test_output_integrity_v21.py
      - name: Commit hotfix to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: v21 output and ranking integrity"
          git push origin HEAD:main
