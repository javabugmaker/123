name: V34 Static Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'agent/static-quality-v34'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and audit tools
        run: |
          pip install -r requirements.txt
          pip install ruff pyright
      - name: Ruff editor-equivalent audit
        continue-on-error: true
        run: ruff check . --select E,F,I,RUF,UP,B,SIM,PERF --output-format concise
      - name: Pyright configured project audit
        continue-on-error: true
        run: pyright
      - name: Pyright GUI attribute audit
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path('pyrightconfig.json').read_text(encoding='utf-8'))
          cfg['include'] = ['gui.py', 'gui_core.py']
          cfg['reportAttributeAccessIssue'] = 'error'
          Path('pyrightconfig.v34.json').write_text(json.dumps(cfg, indent=2), encoding='utf-8')
          PY
          pyright -p pyrightconfig.v34.json
      - name: Compile all project modules
        run: python -m compileall -q .
      - name: Unit tests
        run: python -m unittest discover -p 'test*.py'
