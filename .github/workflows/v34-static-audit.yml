name: V34 Static Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    if: github.head_ref == 'agent/static-quality-v34'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/static-quality-v34
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and audit tools
        run: |
          pip install -r requirements.txt
          pip install ruff pyright
      - name: Apply v34 migration
        run: python tools/v34_migrate.py
      - name: Apply safe Ruff fixes
        run: ruff check . --fix
      - name: Ruff final
        run: ruff check .
      - name: Pyright project
        run: pyright
      - name: Pyright GUI strict
        run: pyright -p pyrightconfig.gui.json
      - name: Compile all project modules
        run: python -m compileall -q .
      - name: Unit tests
        run: python -m unittest discover -p 'test*.py'
      - name: Commit validated product diff
        shell: bash
        run: |
          rm -f tools/v34_migrate.py .github/workflows/v34-static-audit.yml .github/workflows/static-quality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: harden project static quality v34"
          git push origin HEAD:agent/static-quality-v34
