name: Apply v29 Pipeline Reliability

on:
  push:
    branches:
      - agent/pipeline-reliability-v29
    paths:
      - .github/workflows/apply-v29.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-v29.yml
      - tools/apply_v29_pipeline_reliability.py
      - tools/fix_v29_decision_theme.py
      - tools/fix_v29_main_summary.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pipeline-reliability-v29
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Apply v29 patch
        run: python tools/apply_v29_pipeline_reliability.py

      - name: Fix ETF theme projection
        run: python tools/fix_v29_decision_theme.py

      - name: Fix final summary compatibility
        run: python tools/fix_v29_main_summary.py

      - name: Compile
        run: python -m compileall -q .

      - name: Focused v29 tests
        env:
          MPLBACKEND: Agg
        run: python -m unittest -v test_v29_pipeline_reliability.py test_daily_pipeline_v27.py test_v28_gui_backtest.py test_v27_gui_pipeline.py test_gui_workstation_v26.py test_performance_regressions.py

      - name: Full regression suite
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -v

      - name: Commit verified product diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics.py main.py report.py daily_pipeline.py gui.py config.py test_daily_pipeline_v27.py test_v29_pipeline_reliability.py
          git rm tools/apply_v29_pipeline_reliability.py tools/fix_v29_decision_theme.py tools/fix_v29_main_summary.py .github/workflows/apply-v29.yml
          git commit -m "feat: harden daily publication and backtest provenance v29"
          git push origin HEAD:agent/pipeline-reliability-v29
