name: Apply ranking v15

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  test:
    if: github.head_ref == 'agent/ranking-v15'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Apply ranking v15 migration
        run: |
          git fetch origin agent/ranking-v15
          git show origin/agent/ranking-v15:tools/ranking_v15_migration.py > /tmp/ranking_v15_migration.py
          git show origin/agent/ranking-v15:tools/ranking_v15_hotfix.py > /tmp/ranking_v15_hotfix.py
          python /tmp/ranking_v15_migration.py
          python /tmp/ranking_v15_hotfix.py
      - name: Compile
        run: python -m compileall -q .
      - name: Unit tests
        env:
          PYTHONUTF8: '1'
          MPLBACKEND: Agg
        run: python -m unittest discover -v
      - name: Commit validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git show 80d2c77371e7f5b450e7ee3aca8dd3c2b2ec745c:.github/workflows/tests.yml > .github/workflows/tests.yml
          git add config.py scanner.py analytics.py signal_lifecycle.py report.py test_ranking_v15_regressions.py .github/workflows/tests.yml
          git commit -m 'fix: improve ranking quality and ETF diversity'
          git push origin HEAD:main
