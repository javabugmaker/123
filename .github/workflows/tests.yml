name: Regression Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: agent/gui-progress-fix
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply GUI progress fix
        run: python tools/gui_progress_fix.py
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pyright
      - name: Compile
        run: python -m compileall -q .
      - name: Unit tests
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -v
      - name: Pyright GUI check
        run: pyright gui.py gui_core.py
      - name: Commit validated implementation
        if: success()
        run: |
          rm -f tools/gui_progress_fix.py .github/workflows/apply-gui-progress-fix.yml
          cat > .github/workflows/tests.yml <<'EOF'
          name: Regression Tests

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]

          jobs:
            test:
              runs-on: ubuntu-latest
              timeout-minutes: 20
              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                - name: Set up Python
                  uses: actions/setup-python@v5
                  with:
                    python-version: '3.11'
                    cache: pip
                - name: Install dependencies
                  run: python -m pip install --upgrade pip && pip install -r requirements.txt
                - name: Compile
                  run: python -m compileall -q .
                - name: Unit tests
                  env:
                    MPLBACKEND: Agg
                  run: python -m unittest discover -v
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: restore live GUI scan progress and type safety"
          git push origin HEAD:agent/gui-progress-fix
