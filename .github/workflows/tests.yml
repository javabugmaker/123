name: Regression Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/model-v20-consistency-performance
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Repair migration anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/model_v20_migrate.py')
          text = path.read_text(encoding='utf-8')
          old = '''replace_once(
              "gui_core.py",
              ''' + "'''" + '''            "ATR14",\n            "MA20",\n''' + "'''" + ''',
              ''' + "'''" + '''            "ATR14",\n            "ATR50",\n            "ATRExpansion",\n            "ATRExpansionSource",\n            "MA20",\n''' + "'''" + ''',
          )'''
          new = '''replace_once(
              "gui_core.py",
              ''' + "'''" + '''            "StructureScore",\n            "WyckoffPhase",\n''' + "'''" + ''',
              ''' + "'''" + '''            "StructureScore",\n            "ATR14",\n            "ATR50",\n            "ATRExpansion",\n            "ATRExpansionSource",\n            "WyckoffPhase",\n''' + "'''" + ''',
          )'''
          if old not in text:
              raise SystemExit('old GUI ATR migration block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply model v20 migration
        run: python tools/model_v20_migrate.py
      - name: Compile
        run: python -m compileall -q .
      - name: Unit tests
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -v
      - name: Materialize validated source
        run: |
          git show origin/main:.github/workflows/tests.yml > .github/workflows/tests.yml
          rm -f tools/model_v20_migrate.py
          rm -f .github/workflows/model-v20-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: model v20 consistency and performance"
          git push origin HEAD:agent/model-v20-consistency-performance
