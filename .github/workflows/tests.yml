name: Apply GUI v16 filters

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  test:
    if: github.head_ref == 'agent/gui-v16-filters'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Apply GUI v16 migration
        run: |
          git fetch origin agent/gui-v16-filters
          git show origin/agent/gui-v16-filters:tools/gui_v16_migration.py > /tmp/gui_v16_migration.py
          git show origin/agent/gui-v16-filters:test_gui_v16_regressions.py > test_gui_v16_regressions.py
          python /tmp/gui_v16_migration.py
      - name: Compile
        run: python -m compileall -q .
      - name: Unit tests
        env:
          PYTHONUTF8: '1'
          MPLBACKEND: Agg
        run: python -m unittest discover -v
      - name: Commit validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git show 31e9e8b5e84e70faff5cbbd038a982a0e2ecc6db:.github/workflows/tests.yml > .github/workflows/tests.yml
          git add gui_core.py gui.py test_gui_v16_regressions.py .github/workflows/tests.yml
          git commit -m 'fix: rebuild GUI result filters'
          git push origin HEAD:main
