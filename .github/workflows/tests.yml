name: Apply scan service foundation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply migration
        run: python tools/scan_service_migration.py
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Unit tests
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -v
      - name: Commit validated implementation
        if: success()
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/tests.yml
          rm -f tools/scan_service_migration.py
          git config user.name "InstitutionScanner Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "refactor: unify CLI and GUI scan execution"
            git push origin HEAD:${{ github.head_ref }}
          fi
