name: Finalize TickFlow branch

on:
  push:
    branches: [agent/tickflow-finalize]
    paths:
      - tools/finalize_tickflow_branch.py
      - .github/workflows/finalize-tickflow-branch.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tickflow-finalize
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply finalizer
        run: python tools/finalize_tickflow_branch.py
      - name: Compile Python sources
        run: python -m compileall -q downloader.py network_proxy.py fundamental_data.py scanner.py main.py analytics.py gui.py gui_core.py test_tickflow_provider.py test_proxy_regressions.py
      - name: Commit finalized tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: finalize TickFlow Free and AkShare split"
          git push origin HEAD:agent/tickflow-finalize
