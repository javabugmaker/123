name: One-time GUI display cleanup

on:
  push:
    paths:
      - ".github/workflows/gui-display-cleanup.yml"

permissions:
  contents: write

jobs:
  patch-gui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Simplify decision table and restore buy points
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("gui.py")
          text = path.read_text(encoding="utf-8")

          # Keep market/freshness/hard-risk calculations in the engine, but do not
          # occupy scarce main-table space with those diagnostic columns.
          old_columns = '''DISPLAY_COLUMNS = (
              "OverallRank",
              "Ticker",
              "Name",
              "AssetType",
              "EntrySignal",
              "BreakoutVolumeRatio",
              "RankingEligibility",
              "PassedFilters",
              "TradeReadinessReason",
              "RankingScore",
              "InstitutionalTier",
              "InstitutionalScore",
              "FinalScore",
              "QualityGate",
              "QualityDataCompleteness",
              "BacktestSamples",
              "BacktestConfidenceTier",
              "ValueTrapRisk",
              "ChaseRiskScore",
              "HardRiskFlag",
              "DataFreshnessStatus",
              "MarketRegime",
              "DataAsOf",
              "RankingReason",
          )'''
          new_columns = '''DISPLAY_COLUMNS = (
              "OverallRank",
              "Ticker",
              "Name",
              "AssetType",
              "EntrySignal",
              "EntryZone",
              "BreakoutBuyPrice",
              "StopLoss",
              "RankingEligibility",
              "RankingScore",
              "InstitutionalTier",
              "InstitutionalScore",
              "FinalScore",
              "QualityGate",
              "QualityDataCompleteness",
              "BacktestSamples",
              "BacktestConfidenceTier",
              "ValueTrapRisk",
              "ChaseRiskScore",
              "PassedFilters",
              "TradeReadinessReason",
              "DataAsOf",
              "RankingReason",
          )'''
          if old_columns not in text:
              raise SystemExit("DISPLAY_COLUMNS block no longer matches expected main-branch layout")
          text = text.replace(old_columns, new_columns, 1)

          # Make the restored price fields read like actual trading decisions.
          text = text.replace('    "EntryZone": "买入区间",', '    "EntryZone": "回调买点",', 1)
          text = text.replace('    "BreakoutBuyPrice": "突破买入价",', '    "BreakoutBuyPrice": "突破买点",', 1)

          old_widths = '''    "EntrySignal": 112,
              "BreakoutVolumeRatio": 82,
              "EntryZone": 112,
              "StopLoss": 78,'''
          new_widths = '''    "EntrySignal": 112,
              "BreakoutVolumeRatio": 82,
              "EntryZone": 108,
              "BreakoutBuyPrice": 88,
              "StopLoss": 76,'''
          if old_widths in text:
              text = text.replace(old_widths, new_widths, 1)
          elif '    "BreakoutBuyPrice": 88,' not in text:
              marker = '    "EntryZone": 112,\n'
              if marker not in text:
                  raise SystemExit("Unable to locate EntryZone column width")
              text = text.replace(
                  marker,
                  '    "EntryZone": 108,\n    "BreakoutBuyPrice": 88,\n',
                  1,
              )

          # The compact market strip should focus on actionable breadth rather
          # than repeating MarketRegime, which is intentionally hidden from GUI.
          old_overview = '''        regime = (
              f" · {self._market_regime_summary(rows, indexes)}"
              if "MarketRegime" in indexes
              else ""
          )
          self.market_overview.set(
              f"市场概览：{total} 只 · 启动 {breakout} · 可交易 {actionable}{regime} · 最终均分 {average:.1f}"
          )'''
          new_overview = '''        self.market_overview.set(
              f"概览：{total} 只 · 启动 {breakout} · 可交易 {actionable} · 最终均分 {average:.1f}"
          )'''
          if old_overview not in text:
              raise SystemExit("Market overview block no longer matches expected layout")
          text = text.replace(old_overview, new_overview, 1)

          # Remove freshness diagnostics from the summary bar while preserving
          # the underlying filtering/ranking safety logic.
          old_summary = '''            freshness_index = indexes.get("DataFreshnessStatus")
              recommended = sum(
                  len(row) > eligibility_index
                  and self._cell_text(row[eligibility_index]) == "推荐"
                  for row in filtered
              ) if eligibility_index is not None else 0
              stale = sum(
                  len(row) > freshness_index
                  and self._cell_text(row[freshness_index]) == "过期"
                  for row in filtered
              ) if freshness_index is not None else 0
              readiness = f" · 就绪 {recommended}" if eligibility_index is not None else ""
              freshness = f" · 过期 {stale}" if freshness_index is not None and stale else ""
              self.result_summary.set(
                  f"当前文件：{self.current_file} · 命中 {len(filtered):,} / {len(data_rows):,} 条{readiness}{freshness}"
              )'''
          new_summary = '''            recommended = sum(
                  len(row) > eligibility_index
                  and self._cell_text(row[eligibility_index]) == "推荐"
                  for row in filtered
              ) if eligibility_index is not None else 0
              readiness = f" · 就绪 {recommended}" if eligibility_index is not None else ""
              self.result_summary.set(
                  f"当前文件：{self.current_file} · 命中 {len(filtered):,} / {len(data_rows):,} 条{readiness}"
              )'''
          if old_summary not in text:
              raise SystemExit("Result summary block no longer matches expected layout")
          text = text.replace(old_summary, new_summary, 1)

          # Make the result-bar hint match the new decision-first column order.
          text = text.replace(
              'text="双击行查看完整详情 · 单击表头排序"',
              'text="买点与止损优先展示 · 双击查看完整详情 · 单击表头排序"',
              1,
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate GUI module
        shell: bash
        run: |
          python -m py_compile gui.py
          python - <<'PY'
          import gui

          hidden = {"MarketRegime", "DataFreshnessStatus", "HardRiskFlag"}
          assert not hidden.intersection(gui.DISPLAY_COLUMNS), gui.DISPLAY_COLUMNS
          for required in ("EntrySignal", "EntryZone", "BreakoutBuyPrice", "StopLoss"):
              assert required in gui.DISPLAY_COLUMNS, (required, gui.DISPLAY_COLUMNS)
          assert gui.DISPLAY_COLUMNS.index("EntryZone") < gui.DISPLAY_COLUMNS.index("RankingScore")
          assert gui.DISPLAY_COLUMNS.index("StopLoss") < gui.DISPLAY_COLUMNS.index("RankingScore")
          print("GUI display checks passed")
          PY

      - name: Commit GUI update
        shell: bash
        run: |
          if git diff --quiet -- gui.py; then
            echo "No GUI changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gui.py
          git commit -m "ui: restore buy points and simplify decision table"
          git push origin HEAD:main
